name: spm
description: Unified static analysis and runtime profiling for Flutter rebuild scopes and their triggers.
version: 0.1.2
repository: https://github.com/32bytess/spm
issue_tracker: https://github.com/32bytess/spm/issues
documentation: https://github.com/32bytess/spm/wiki

platforms:
  android:

topics:
  - flutter
  - cli
  - static-analysis
  - profiling

environment:
  sdk: ^3.9.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  analyzer: ">=13.0.0 <15.0.0"
  args: ^2.7.0
  path: ^1.9.0
  dartz: ^0.10.1
  vm_service: ^15.0.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
  spm:
